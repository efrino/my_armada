name: my_armada
description: "A new Flutter project."
publish_to: 'none'
version: 0.2.0

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  http: ^1.6.0
  mobile_scanner: ^7.1.3
  intl: ^0.20.0
  shared_preferences: ^2.4.3
  carousel_slider: ^5.1.1
  logging: ^1.3.0
  device_info_plus: ^12.2.0
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/img/icon-maj.png
    - assets/img/banner1.jpg
    - assets/img/banner2.jpg
    - assets/img/banner3.jpg

flutter_icons:
  android: true
  ios: true
  image_path: "assets/img/icon-maj.png"